---
- name: Initialize Kubernetes Master Node
  hosts: master
  become: yes
  tasks:
    - name: Install containerd
      apt:
        name: containerd
        state: present

    - name: Configure containerd for Kubernetes
      shell: |
        containerd config default | sudo tee /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
      args:
        executable: /bin/bash

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes

    - name: Load br_netfilter kernel module
      modprobe:
        name: br_netfilter
        state: present

    - name: Ensure bridge-nf-call-iptables is set to 1
      sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: '1'
        state: present
        reload: yes

    - name: Initialize the Kubernetes cluster using kubeadm
      command: kubeadm init --pod-network-cidr=10.244.0.0/16 --ignore-preflight-errors=all
      register: kubeadm_init
      ignore_errors: yes

    - name: Debug kubeadm init output
      debug:
        var: kubeadm_init

    - name: Set up the Kubernetes config directory for the current user
      file:
        path: $HOME/.kube
        state: directory
        mode: 0755

    - name: Copy admin.conf to the user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: $HOME/.kube/config
        remote_src: yes
        owner: "{{ ansible_user }}"
      when: kubeadm_init.rc == 0

    - name: Install a CNI plugin (e.g., Flannel)
      command: kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      ignore_errors: yes
      when: kubeadm_init.rc == 0

    - name: Generate join command for worker nodes
      command: kubeadm token create --print-join-command
      register: join_command
      when: kubeadm_init.rc == 0

    - name: Debug join command
      debug:
        var: join_command.stdout
      when: kubeadm_init.rc == 0
