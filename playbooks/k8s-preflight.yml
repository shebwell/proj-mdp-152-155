---
- name: Kubernetes Preflight Setup
  hosts: master
  become: yes
  tasks:
    - name: Disable swap
      command: swapoff -a
      when: ansible_swaptotal_mb > 0
      ignore_errors: yes

    - name: Remove swap entry from /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'
      notify: Reboot if required

    - name: Configure Kubernetes sysctl settings
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl params
      command: sysctl --system

    - name: Ensure containerd is enabled and started
      systemd:
        name: containerd
        state: restarted
        enabled: yes

  handlers:
    - name: Reboot if required
      reboot:
        msg: "Reboot initiated by Ansible for swap removal."
        pre_reboot_delay: 5
