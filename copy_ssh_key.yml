---
- name: Copy SSH public key to Kubernetes nodes
  hosts: k8s_cluster
  gather_facts: no
  vars:
    public_key_path: "/home/ubuntu/.ssh/id_rsa.pub"

  tasks:
    - name: Read public key from control node
      local_action: slurp src="{{ public_key_path }}"
      register: public_key_content
      delegate_to: localhost
      run_once: true

    - name: Ensure .ssh directory exists on remote node
      file:
        path: /home/ubuntu/.ssh
        state: directory
        mode: '0700'
        owner: ubuntu
        group: ubuntu

    - name: Add public key to authorized_keys
      authorized_key:
        user: ubuntu
        key: "{{ public_key_content.content | b64decode }}"
